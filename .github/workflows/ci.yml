name: CI — Lint & Backend Health Check

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    name: Verify FastAPI & Frontend Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python syntax & static assets
        run: |
          python -m py_compile backend/__init__.py backend/main.py backend/agent_manager.py backend/workspace_git.py
          test -f frontend/index.html
          test -f frontend/styles.css
          test -f frontend/app.js
          test -f LICENSE
          echo "All backend modules and frontend assets verified!"

